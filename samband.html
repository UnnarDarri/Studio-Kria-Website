---
layout: page.liquid
title: Hafa samband
---

<div class="content">
  <span class="pill">Vertu í bandi</span>
  
  <div class="contact-page-layout">
  
    <div class="contact-form-col">
      <p style="max-width:520px; font-weight:300; color:var(--cream); opacity:0.85; line-height:1.6; margin:0 0 28px;">
        Getið þið hjálpað mér með auglýsingu? Sendu okkur línu og við höfum samband sem fyrst.
      </p>
  
      <form class="contact-form" id="contactForm">
        <input type="hidden" name="access_key" value="b922ed94-dd43-4f59-9f29-186903defbff">
        <input type="hidden" name="subject" value="Ný fyrirspurn af studiokria.is">
        <input type="text" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
  
        <div class="form-field">
          <label for="name">Nafn</label>
          <input type="text" id="name" name="name" placeholder="Fullt nafn" required>
        </div>
        <div class="form-field">
          <label for="email">Netfang</label>
          <input type="email" id="email" name="email" placeholder="netfang@example.com" required>
        </div>
        <div class="form-field">
          <label for="message">Skilaboð</label>
          <textarea id="message" name="message" placeholder="Segðu okkur frá verkefninu þínu..." required></textarea>
        </div>
        <button type="submit" class="form-submit" id="formSubmitBtn">Senda skilaboð</button>
        <p class="form-status" id="formStatus" aria-live="polite"></p>
      </form>
    </div>
  
    <div class="contact-info-col">
      <div class="contact-info-block">
        <h3>Hafðu samband</h3>
        <div class="info-row">
          <span>Netfang</span>
          <a href="mailto:hello@studiokria.is">hello@studiokria.is</a>
        </div>
        <div class="info-row">
          <span>Sími</span>
          <a href="tel:+3541234567">123-4567</a>
        </div>
        <div class="info-row">
          <span>Kennitala</span>
          <p>0101072020</p>
        </div>
      </div>
    </div>
  
  </div>
</div>

<script>
  const contactForm = document.getElementById('contactForm');
  const formStatus = document.getElementById('formStatus');
  const formSubmitBtn = document.getElementById('formSubmitBtn');

  contactForm.addEventListener('submit', async function(e){
    e.preventDefault();
    formSubmitBtn.disabled = true;
    formSubmitBtn.textContent = 'Sendi...';
    formStatus.textContent = '';
    formStatus.className = 'form-status';

    const formData = new FormData(contactForm);
    try{
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: formData
      });
      const result = await res.json();
      if (result.success){
        formStatus.textContent = 'Takk fyrir! Skilaboðin þín voru send.';
        formStatus.classList.add('form-status--ok');
        contactForm.reset();
      } else {
        throw new Error(result.message || 'Villa kom upp');
      }
    } catch(err){
      formStatus.textContent = 'Eitthvað fór úrskeiðis. Prófaðu aftur eða sendu okkur línu beint á hello@studiokria.is.';
      formStatus.classList.add('form-status--error');
    } finally {
      formSubmitBtn.disabled = false;
      formSubmitBtn.textContent = 'Senda skilaboð';
    }
  });
</script>
