---
layout: page.liquid
title: contact
---

<div class="content">
  <span class="pill">{{ 'contact_header' | i18n }}</span>
  
  <div class="contact-page-layout">
  
    <div class="contact-form-col">
      <p style="max-width:520px; font-weight:300; color:var(--cream); opacity:0.85; line-height:1.6; margin:0 0 28px;">
        {{ 'contact_form_description' | i18n }}
      </p>
  
      <form class="contact-form" id="contactForm">
        <input type="hidden" name="access_key" value="b922ed94-dd43-4f59-9f29-186903defbff">
        <input type="hidden" name="subject" value="Ný fyrirspurn af studiokria.is">
        <input type="text" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
  
        <div class="form-field">
          <label for="name">{{ 'name_label' | i18n }}</label>
          <input type="text" id="name" name="name" placeholder="{{ 'contact_name_placeholder' | i18n }}" required>
        </div>
        <div class="form-field">
          <label for="email">{{ 'email_label' | i18n }}</label>
          <input type="email" id="email" name="email" placeholder="{{ 'contact_email_placeholder' | i18n }}" required>
        </div>
        <div class="form-field">
          <label for="message">{{ 'message_label' | i18n }}</label>
          <textarea id="message" name="message" placeholder="{{ 'contact_message_placeholder' | i18n }}" required></textarea>
        </div>
        <button type="submit" class="form-submit" id="formSubmitBtn">{{ 'send_message_label' | i18n }}</button>
        <p class="form-status" id="formStatus" aria-live="polite"></p>
      </form>
    </div>
  
    <div class="contact-info-col">
      <div class="contact-info-block">
        <h3>{{ 'contact' | i18n }}</h3>
        <div class="info-row">
          <span>{{ 'email_label' | i18n }}</span>
          <a href="mailto:info@studiokria.is">info@studiokria.is</a>
        </div>
        <div class="info-row">
          <span>{{ 'phone_label' | i18n }}</span>
          <a href="tel:+3548606690">860-6690</a>
        </div>
        <div class="info-row">
          <span>{{ 'kt_label' | i18n }}</span>
          <p>0101010101</p>
        </div>
      </div>
    </div>
  
  </div>
</div>

<script src="/js/contact.js" type="module"></script>
